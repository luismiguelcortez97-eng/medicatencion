services:
  - type: web
    name: medicatencion
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_SECRET
        generateValue: true
      - key: DATABASE_PATH
        value: control_financiero.db
